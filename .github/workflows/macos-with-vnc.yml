name: macos-with-vnc
on: 
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v2
    
    - name: Setting the environment up.
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        VNC_USER_PASSWORD: ${{ secrets.VNC_USER_PASSWORD }}
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      run: source configure.sh "$VNC_USER_PASSWORD" "$VNC_PASSWORD" "$TAILSCALE_AUTHKEY"
    
    - name: Show Connection Info & Keep Alive
      run: |
        echo "=== CONNECTION INFO ==="
        echo "Tailscale IP: $(sudo tailscale ip -4)"
        echo "VNC Port: 5900"
        echo "Username: vncuser"
        echo "======================"
        echo "الجهاز هيفضل شغال لمدة 6 ساعات..."
        sleep 21600
